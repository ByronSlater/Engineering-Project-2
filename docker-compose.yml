services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: acebook_springboot_development
      POSTGRES_USER: acebook
      POSTGRES_PASSWORD: acebook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acebook -d acebook_springboot_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: acebook_springboot_development
      DB_USERNAME: acebook
      DB_PASSWORD: acebook
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
