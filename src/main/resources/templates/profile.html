<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/normalize.css" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/profile.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=thumb_up" />
    <!--        Font for body:-->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
    <!--        Font for Logo:-->
    <link
            href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Roboto:ital,wght@0,300;1,300&display=swap"
            rel="stylesheet">
    <meta charset="UTF-8">


    <title>Title</title>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container">
        <main>
            <h1>Profile</h1>


            <div>
                <img th:src="@{'/images/' + ${user.profile_picture}}"
                alt="Profile Picture"
                width="100"
                height="100"
                class="profile-picture">
                <h2 th:action="@{/profile}" th:object="${user}" method="get"></h2>
                <h3 th:text="${user.username}"></h3>
            </div>

        <h4>Posts:</h4>

            <div class="posts">
                <div class="post" th:each="post : ${posts}">
                    <div class="post-left">
                        <img th:src="@{'/images/' + ${post.user.profile_picture}}" alt="Profile Picture" width="50"
                             height="50">
                    </div>
                    <div class="post-right">
                        <div class="above-comments">
                            <div>
                                <div class="top-row">
                                    <p class="author" th:text="${post.user.getNickName()}"></p>
                                    <p class="created-at" th:text="${#temporals.format(post.getCreatedAt(), 'dd/MM/yyyy')}"></p>
                                </div>
                                <p th:text="${post.content}"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
