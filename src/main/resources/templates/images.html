<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head lang="en">
  <link rel="stylesheet" href="/css/normalize.css" />
  <link rel="stylesheet" href="/css/main.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=thumb_up" />
  <!--        Font for body:-->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
  <!--        Font for Logo:-->
  <link
    href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Roboto:ital,wght@0,300;1,300&display=swap"
    rel="stylesheet">

  <meta charset="UTF-8" />
  <title>Acebook</title>
</head>

<body>
  <!--    wire to navbar:-->
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <div class="container">
    <main>
      <h1>Images</h1>

      <form action="/images/upload" method="POST" enctype="multipart/form-data">

        <div class="form-group">
          <label for="file">Select JPEG Image:</label>
          <!-- Accept attribute guides the browser file picker -->
          <input type="file" id="file" name="file" accept="image/jpeg, image/jpg" required>
        </div>

        <button type="submit">Upload Image</button>
      </form>

      <div th:each="image : ${images}">
        <p>An image!</p>
        <img th:src="${image.getImageHash()} + .jpg" height="50px" width="50px"/>
      </div>
    </main>
</body>

</html>
