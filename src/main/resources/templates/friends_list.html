<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head lang="en">
    <link rel="stylesheet" href="/css/normalize.css" />
    <link rel="stylesheet" href="/css/main.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=thumb_up,delete,image,edit" />
    <!--        Font for body:-->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
    <!--        Font for Logo:-->
    <link
        href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Roboto:ital,wght@0,300;1,300&display=swap"
        rel="stylesheet">

    <meta charset="UTF-8" />
    <title>Acebook</title>
</head>

<body>
    <!--    wire to navbar:-->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container">
    <main>
      <h3>Requests</h3>
      <div th:each="friend : ${requests}">
        <p th:text="${friend.getSender().getUsername()}"></p>

        <div th:switch="${friend.getStatus().getDescription()}" class="friend">
            <div th:case="'pending'" style="display: flex; flex-flow: row nowrap;">
                <form method="post" th:action="@{/acceptfriend/{id}(id=${friend.getSender().getId()})}">
                    <input type="submit" class="button" value="accept" />
                </form>
                <form method="post" th:action="@{/declinefriend/{id}(id=${friend.getSender().getId()})}">
                    <input type="submit" class="button" value="decline" />
                </form>
            </div>
        </div>
      </div>
    </main>
    </div>
</body>

</html>
