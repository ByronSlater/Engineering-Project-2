<!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5" >
    <head lang="en">
        <link rel="stylesheet" href="/main.css" />

        <link rel="stylesheet"
              href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=thumb_up" />
<!--        Font for body:-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;1,300&display=swap" rel="stylesheet">

<!--        Font for Logo:-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Roboto:ital,wght@0,300;1,300&display=swap" rel="stylesheet">

        <style>
            .like-form {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: fit-content;
            }

            .like-button {
                background: transparent;
                border: none;
                padding: 0;
                margin: 0;
                font-size: 40px;
                cursor: pointer;
                appearance: none;
                -webkit-appearance: none;
            }
            .material-symbols-outlined {
                font-size: 32px;
                font-variation-settings:
                        'FILL' 0,
                        'wght' 400,
                        'GRAD' 0,
                        'opsz' 24;

                transition: 0.2s;
            }

            .like-button:hover .material-symbols-outlined {
                color: #1877f2;
                font-variation-settings:
                        'FILL' 1,
                        'wght' 400,
                        'GRAD' 0,
                        'opsz' 24;
            }

            .like-count {
                margin: 0;
                font-size: 12px;
            }
        </style>
        <meta charset="UTF-8"/>
        <title>Acebook</title>
        <link rel="stylesheet" href="/main.css" />
    </head>
    <body>
<!--    wire to navbar:-->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <h1>Posts</h1>

    <div sec:authorize="isAuthenticated()" id="greeting">
        Signed in as <span sec:authentication="principal.attributes['email']"></span>
    </div>

    <form action="#" th:action="@{/posts}" th:object="${post}" method="post">
        <p>Content: <input type="text" th:field="*{content}" /></p>
        <p><input type="submit" value="Submit" /> <input type="reset" value="Reset" /></p>
    </form>

    <ul th:each="post : ${posts}">
        <li>
            <img th:src="@{'/images/' + ${post.user.profile_picture}}"
                alt="Profile Picture"
            width="50"
            height="50">
            <p th:text="${post.content}"></p>

            <p th:text="${post.user.username + ' posted: ' + post.content}"></p>
            <form th:action="@{/posts/{id}/like(id=${post.id})}" method="post" class="like-form">
                <button type="submit" class="like-button">
                    <span class ="material-symbols-outlined">thumb_up</span>
                </button>

                <button type="button" class="like-count" th:text="${post.getLikedBy().size()}"
                        onclick="this.parentElement.nextElementSibling.hidden =
                        !this.parentElement.nextElementSibling.hidden">
                </button>
            </form>
            <div hidden>
                <p th:each="user : ${post.likedBy}"
                   th:text="${user.username}">
                </p>
            </div>
        </li>
    </ul>

    </body>
</html>
