<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head lang="en">
    <link rel="stylesheet" href="/css/normalize.css" />
    <link rel="stylesheet" href="/css/main.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=thumb_up" />
    <!--        Font for body:-->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
    <!--        Font for Logo:-->
    <link
        href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Roboto:ital,wght@0,300;1,300&display=swap"
        rel="stylesheet">

    <meta charset="UTF-8" />
    <title>Acebook</title>
</head>

<body>
    <!--    wire to navbar:-->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container">
        <main>
            <h1>Timeline</h1>

            <form class="post-form" action="#" th:action="@{/posts}" th:object="${post}" method="post">
                <h2>What's on your mind..</h2>
                <div class="form-group">
                    <input type="text" th:field="*{content}" />
                    <input type="submit" value="Post" />
                </div>
            </form>

            <form class="sort-form" th:action="@{/posts}" method="get">
                <select name="sort" id="sort" onchange="this.form.submit()">
                    <option value="newest" th:selected="${sort == 'newest'}">
                        Newest
                    </option>

                    <option value="oldest" th:selected="${sort == 'oldest'}">
                        Oldest
                    </option>
                </select>
            </form>


            <!-- Posts -->
            <div class="posts">
                <div class="post" th:each="post : ${posts}">
                    <div class="post-left">
                        <img th:src="@{'/images/' + ${post.user.profile_picture}}" alt="Profile Picture" width="50"
                            height="50">
                    </div>
                    <div class="post-right">
                        <div class="above-comments">
                            <div>
                                <div class="top-row">
                                    <p class="author" th:text="${post.user.getNickName()}"></p>
                                    <p class="created-at" th:text="${#temporals.format(post.getCreatedAt(), 'dd/MM/yyyy')}"></p>
                                </div>
                                <p th:text="${post.content}"></p>
                            </div>

                            <form th:action="@{/posts/{id}/like(id=${post.id})}" method="post" class="like-form">
                                <button type="submit" class="like-button">
                                    <span class="material-symbols-outlined">thumb_up</span>
                                </button>

                                <button type="button"
                                        class="like-count"
                                        th:text="${post.getLikedBy().size()}"
                                        th:attr="data-likes-target=${'liked-by-' + post.id}"
                                        onclick="const list = document.getElementById(this.dataset.likesTarget);
                                        list.hidden = !list.hidden;">
                                </button>
                            </form>
                        </div>
                        <div th:id="${'liked-by-' + post.id}" hidden>
                            <p th:each="user : ${post.likedBy}"
                               th:text="${#strings.substringBefore(user.username, '@')}">
                            </p>
                        </div>

                        <!-- Comments -->
                        <div th:if="${post.comments.size() > 0}" class="comments">
                            <div th:each="comment : ${post.comments}" class="comment">
                                <div class="comment-content">
                                    <p th:text="${comment.getText()}"></p>
                                    <p th:text="${comment.getUser().getNickName()}" class="author"></p>
                                </div>
                                <form th:action="@{/comments/{id}/like(id=${comment.id})}" method="post"
                                    class="like-form">
                                    <button type="submit" class="like-button">
                                        <span class="material-symbols-outlined">thumb_up</span>
                                    </button>

                                    <button type="button"
                                            class="like-count"
                                            th:text="${comment.getLikedBy().size()}"
                                            th:attr="data-likes-target=${'comment-liked-by-' + comment.id}"
                                            onclick="const list = document.getElementById(this.dataset.likesTarget);
                                            list.hidden = !list.hidden;">
                                    </button>
                                </form>
                                <div th:id="${'comment-liked-by-' + comment.id}" hidden>
                                    <p th:each="user : ${comment.likedBy}"
                                       th:text="${#strings.substringBefore(user.username, '@')}">
                                    </p>
                                </div>
                            </div>

                        </div>
                        <form class="add-comment-form" th:action="@{/posts/{id}/comments(id=${post.id})}"
                            th:object="${commentForm}" method="post">
                            <div class="form-group">
                                <input type="text" th:field="*{text}" placeholder="Write a comment..." required />
                                <button type="submit">Reply</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
